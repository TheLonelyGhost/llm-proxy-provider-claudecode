name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # llm-proxy installs the release whose tag matches the manifest version.
      - name: Verify manifest version matches tag
        run: |
          manifest_version="$(jq -r .version manifest/llm-proxy-provider-claudecode.manifest.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::manifest version '$manifest_version' does not match tag '$tag_version'"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'

      # `task lint:build` runs `golangci-lint custom`, which needs a golangci-lint v2
      # binary on PATH. Keep the version equal to `version` in .custom-gcl.yml.
      # Not golangci-lint-action: when .custom-gcl.yml exists, it puts only its
      # own custom build on PATH. setup-go puts GOPATH/bin on PATH.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run the quality gate
        run: task quality-gate

      # One archive per platform (binary + manifest at the archive root) and a
      # SHA256SUMS file, the layout llm-proxy's `plugin install` expects.
      - name: Build release archives
        run: task package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
