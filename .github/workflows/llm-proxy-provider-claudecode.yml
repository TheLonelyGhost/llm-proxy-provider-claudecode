name: llm-proxy-provider-claudecode quality gate

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/llm-proxy-provider-claudecode.yml'
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/llm-proxy-provider-claudecode.yml'

permissions:
  contents: read

jobs:
  quality-gate:
    name: llm-proxy-provider-claudecode quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'

      # `task lint:build` runs `golangci-lint custom`, which needs a golangci-lint v2
      # binary on PATH. Keep the version equal to `version` in .custom-gcl.yml.
      # Not golangci-lint-action: when .custom-gcl.yml exists, it puts only its
      # own custom build on PATH. setup-go puts GOPATH/bin on PATH.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run the quality gate
        working-directory: .
        run: |
          set -o pipefail
          task quality-gate --output prefixed 2>&1 | tee suite.log

      - name: Upload suite log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-proxy-provider-claudecode-quality-gate-log
          path: suite.log
